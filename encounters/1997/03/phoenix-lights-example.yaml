description: |
  On the evening of March 13, 1997, thousands of people in Phoenix, Arizona
  and surrounding areas reported seeing a massive V-shaped or triangular
  formation of lights in the sky.

  The sighting occurred in two distinct phases:
  1. A triangular formation of lights that moved slowly across the state
  2. A series of stationary lights that appeared over Phoenix

  Witnesses included pilots, police officers, and ordinary citizens.
  The event remains one of the most witnessed UFO sightings in history.

  NOTE: This is an example file for demonstration purposes.

