title: "USS Nimitz FLIR1 Infrared Footage (2004)"
publicationDate: "2017-12-16"

description: |
  The FLIR1 video, recorded on November 14, 2004 by the weapons systems 
  officer aboard an F/A-18F Super Hornet from the USS Nimitz carrier 
  strike group, captures infrared footage of an unidentified aerial 
  phenomenon off the coast of Southern California.

  The object appears as a white, oblong shape on the FLIR sensor, 
  demonstrating no visible propulsion, no wings, and extraordinary 
  maneuverability. The video was officially released by the Pentagon 
  in April 2020 as part of a package of UAP-related materials.

  Originally leaked in 2007, it gained widespread attention after 
  The New York Times published an investigative piece in December 2017 
  alongside the announcement of the Advanced Aerospace Threat 
  Identification Program (AATIP).

